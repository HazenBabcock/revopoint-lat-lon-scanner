[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lat_lon_scanner"
version = "0.1.0"
description = "Drive the lat/lon stage and a Revopoint MINI scanner to build point clouds."
requires-python = ">=3.10"
# Also needs revopoint-python (github.com/HazenBabcock/revopoint-python), which
# is not on PyPI: install it with 'pip install -e <checkout>'.
dependencies = ["numpy", "pyserial", "requests"]

[project.optional-dependencies]
reconstruct = ["open3d", "scipy"]

[tool.setuptools]
packages = ["lat_lon_scanner"]
